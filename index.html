<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Grantly helps students discover, understand and track scholarships in one place.">
<title>Grantly – Scholarships made simple</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="w">
  <header class="top">
    <div><h1>🎓 Grantly</h1><p class="mu">Tell us about you once. We find, rank and track scholarships for you.</p></div>
    <button class="g" id="theme" type="button" aria-label="Toggle dark mode">◐</button>
  </header>

  <main id="main">
    <section class="card" aria-labelledby="h-prof">
      <h2 id="h-prof">1 · Your profile</h2>
      <div class="row">
        <div><label for="lvl">Level</label><select id="lvl"><option value="school">School</option><option value="ug" selected>Undergraduate</option><option value="pg">Postgraduate</option></select></div>
        <div><label for="fld">Field</label><select id="fld"><option value="tech">Tech / Engineering / BCA</option><option value="sci">Science</option><option value="com">Commerce / Arts</option><option value="med">Medical</option></select></div>
        <div><label for="cat">Category</label><select id="cat"><option>General</option><option>OBC</option><option>SC</option><option>ST</option><option>EWS</option></select></div>
        <div><label for="gen">Gender</label><select id="gen"><option>Female</option><option>Male</option><option>Other</option></select></div>
        <div><label for="inc">Family income (₹ lakh/year)</label><input type="number" id="inc" min="0" step="0.5" value="4" inputmode="decimal"></div>
        <div><label for="mk">Last marks (%)</label><input type="number" id="mk" min="0" max="100" value="75" inputmode="decimal"></div>
      </div>
    </section>

    <section id="sum" class="card hero" aria-live="polite"></section>

    <div class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="t-d" aria-controls="p-d" aria-selected="true" type="button">🔍 Discover</button>
      <button role="tab" id="t-t" aria-controls="p-t" aria-selected="false" tabindex="-1" type="button">📌 My tracker</button>
    </div>

    <section role="tabpanel" id="p-d" aria-labelledby="t-d">
      <div class="row bar-row">
        <div><label for="q">Search</label><input type="search" id="q" placeholder="Name or provider…"></div>
        <div><label for="srt">Sort by</label><select id="srt"><option value="m">Best match</option><option value="a">Highest amount</option><option value="d">Closest deadline</option></select></div>
        <label class="chk inline"><input type="checkbox" id="only"> Only fully eligible</label>
      </div>
      <div id="list"></div>
      <p class="mu small">Demo data: scholarships shown are illustrative samples, not real listings. Always verify on the official portal.</p>
    </section>

    <section role="tabpanel" id="p-t" aria-labelledby="t-t" hidden>
      <div class="stats" id="stats"></div>
      <div id="tracker"></div>
    </section>
  </main>
</div>
<dialog id="dlg" aria-labelledby="dt"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
